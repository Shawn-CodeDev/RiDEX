<text x="76" y="57" class="head">Direction proposal</text>
<text x="40" y="87" class="sub">Choose a local reward-relevant velocity space</text>
<g transform="translate(50,109)">
<path d="M0 137L103 137L103 8" fill="none" stroke="#e9eff1" stroke-width="2"/>
<circle cx="116" cy="110" r="31" fill="#edf4f6" stroke="#b4c9d2"/>
<circle cx="116" cy="110" r="5" fill="#1b5766"/>
