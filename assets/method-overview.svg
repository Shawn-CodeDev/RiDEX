<text x="113" y="153" text-anchor="middle" class="small">zₜ</text>
</g>
<line x1="366" y1="156" x2="394" y2="156" stroke="#6d8792" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="412" y="34" width="32" height="32" rx="9" fill="#e3f6ef"/><text x="428" y="56" text-anchor="middle" font-size="15" font-weight="800" fill="#067567">02</text>
<text x="454" y="57" class="head">Terminal measurement</text>
<text x="413" y="87" class="sub">Same center; equal and opposite interventions</text>
<circle cx="454" cy="166" r="29" fill="#eef3f5" stroke="#becfd5"/>
<text x="454" y="169" text-anchor="middle" font-size="17" font-weight="800">zₜ</text>
<path d="M483 154C524 154 521 127 559 127" stroke="#087f7b" fill="none" stroke-width="3" marker-end="url(#tealarrow)"/>
