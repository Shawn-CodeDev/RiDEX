<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 394" role="img" aria-labelledby="title desc">
<title id="title">RiDEx method overview</title>
<desc id="desc">Reward-informed direction proposal at a generation state, symmetric positive and negative rollouts, terminal reward contrast, state-matched local credit, and global NFT learning.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#f0f8f6"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4d6b74"/></marker>
  <marker id="tealarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#087f7b"/></marker>
  <style>
  text{font-family:Arial,Helvetica,sans-serif}
  .head{font-size:18px;font-weight:800}.sub{font-size:12px;fill:#5a7280}.small{font-size:12px;fill:#536977}.tag{font-size:13px;font-weight:750}
  </style>
</defs>
