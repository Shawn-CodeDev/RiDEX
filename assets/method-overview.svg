<path d="M901 160L955 160" stroke="#087f7b" stroke-width="4" marker-end="url(#tealarrow)"/>
<rect x="962" y="127" width="140" height="67" rx="14" fill="#ecf8f2" stroke="#b5dfce"/>
<text x="1032" y="153" text-anchor="middle" font-size="14" font-weight="800">Local update</text>
<text x="1032" y="175" text-anchor="middle" font-size="13">d · u</text>
<text x="795" y="236" class="small">Grad: additive gradient combination</text>
<text x="795" y="255" class="small">CFG: projected, norm-matched combination</text>
<rect x="18" y="312" width="1104" height="63" rx="14" fill="#162e3e"/>
<text x="42" y="339" fill="#d8f4ef" font-size="15" font-weight="800">Global learning:</text>
<text x="185" y="339" fill="#ffffff" font-size="14">All completed endpoints train DiffusionNFT alongside local state credit.</text>
<text x="42" y="360" fill="#b6cbd0" font-size="11">The paired exploration and reward measurement are training operations; the trained model uses its standard sampler.</text>
</svg>