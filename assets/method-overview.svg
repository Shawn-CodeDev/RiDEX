<text x="612" y="233" class="tag" text-anchor="middle">R⁻</text>
<rect x="558" y="160" width="135" height="40" rx="10" fill="#f4f8f9" stroke="#dce6e9"/>
<text x="626" y="185" class="tag" text-anchor="middle">ΔR = R⁺ − R⁻</text>
<text x="460" y="275" class="small">Completed images → terminal reward scores</text>
<line x1="746" y1="156" x2="775" y2="156" stroke="#6d8792" stroke-width="3" marker-end="url(#arrow)"/>
